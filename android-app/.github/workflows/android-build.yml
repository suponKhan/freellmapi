name: Android Build & Release

on:
  push:
    branches:
      - android-gateway
  pull_request:
    branches:
      - android-gateway
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-jdk: 17
      
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/keystore.jks
          echo "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android-app/keystore.password
          echo "${{ secrets.ANDROID_KEY_ALIAS }}" > android-app/keystore.alias
          echo "${{ secrets.ANDROID_KEY_PASSWORD }}" > android-app/keystore.keypassword
      
      - name: Build APK
        working-directory: android-app
        env:
          KEYSTORE_PATH: ../android-app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
      
      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-${{ matrix.abi }}
          path: ${{ steps.find_apk.outputs.apk_path }}
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/android-gateway'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: FreeLLM Gateway ${{ matrix.abi }} - ${{ github.ref_name }}
          tag_name: ${{ matrix.abi }}-${{ github.ref_name }}
          body: |
            Auto-built Android APK for ${{ matrix.abi }} architecture.
            Synced from upstream: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}