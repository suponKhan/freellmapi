name: Android Build & Release

on:
  push:
    branches:
      - android-gateway
  pull_request:
    branches:
      - android-gateway
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-jdk: 17

      - name: Generate Debug Keystore for Release Signing
        run: |
          mkdir -p android-app/app
          keytool -genkeypair -v -keystore android-app/app/debug.keystore \
            -alias androiddebugkey -keypass android -storepass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find and Rename APK
        id: find_apk
        run: |
          RAW_APK=$(find android-app/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK: $RAW_APK"
          FINAL_NAME="freellm-gateway-${{ matrix.abi }}-release.apk"
          cp "$RAW_APK" "$FINAL_NAME"
          echo "apk_path=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-${{ matrix.abi }}
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Release
        if: github.ref == 'refs/heads/android-gateway'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: "FreeLLM Gateway ${{ matrix.abi }} (${{ github.sha }})"
          tag_name: "release-${{ matrix.abi }}"
          body: |
            ### FreeLLM Gateway Android App
            - Architecture: `${{ matrix.abi }}`
            - Commit: `${{ github.sha }}`
            - Automated GitHub Actions build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
