name: Android Build & Release

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug and Fix gradlew
        working-directory: android-app
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          head -n 5 gradlew
          file gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          file gradlew

      - name: Create local.properties
        working-directory: android-app
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate debug keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v -keystore app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Test executing gradlew directly via bash
        working-directory: android-app
        run: |
          bash ./gradlew --version

      - name: Build APK
        working-directory: android-app
        run: |
          bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apks
          path: android-app/app/build/outputs/apk/release/*.apk
