name: android-build
on:
  push:
    branches: [ android-gateway ]
    paths-ignore:
      - 'build-log.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Set up Gradle 8.2.1
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2.1

      - name: Build APK
        working-directory: android-app
        run: |
          set +e
          {
            echo "=== Environment ==="
            echo "JAVA_HOME=$JAVA_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            which gradle
            gradle --version
            echo "=== Building APK ==="
            gradle clean assembleRelease --no-daemon --console=plain --stacktrace
            echo "BUILD EXIT CODE: $?"
          } 2>&1 | tee build-log.txt
          echo "=== LOG SIZE ==="
          wc -c build-log.txt

      - name: Push build log via git
        if: always()
        working-directory: android-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-log.txt || true
          git diff --cached --stat || true
          git commit -m "build log" || echo "Nothing to commit"
          git push origin HEAD:android-gateway || echo "Push failed (non-fatal)"

      - name: Search for APK
        if: always()
        working-directory: android-app
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build outputs ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/build-log.txt
          if-no-files-found: warn

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
          if-no-files-found: warn