name: android-build
on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6.3-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -C /tmp
          echo "/tmp/gradle-7.6.3/bin" >> $GITHUB_PATH

      - name: Check gradle version
        run: gradle --version

      - name: Build APK with system gradle
        working-directory: android-app
        run: |
          echo "=== Building APK ==="
          gradle clean assembleRelease --no-daemon --stacktrace 2>&1 || true

      - name: Search for APK
        working-directory: android-app
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== Build outputs ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
            android-app/app/build/outputs/apk/**/*.apk
            android-app/app/build/outputs/apk/release/*.apk