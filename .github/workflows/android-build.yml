name: android-build

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget
          mkdir -p \C:\Users\khans/android_sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d \C:\Users\khans/android_sdk/cmdline-tools
          export ANDROID_SDK_ROOT=\C:\Users\khans/android_sdk
          yes | \C:\Users\khans/android_sdk/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=\ "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install gradle (system package)
        run: |
          sudo apt-get install -y gradle

      - name: Build APK (attempt)
        working-directory: android-app
        run: |
          gradle assembleRelease || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: android-app/app/build/outputs/**/*.apk
