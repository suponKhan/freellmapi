name: android-build
on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build Android APK
        uses: android-actions/build.gradle@v2
        with:
          project: android-app
          task: assembleRelease

      - name: List APK files
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f
          echo "=== Checking build outputs ==="
          ls -la android-app/app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: android-app/app/build/outputs/apk/release/*.apk