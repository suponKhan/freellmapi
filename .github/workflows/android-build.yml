name: android-build
on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Download Gradle 8.0.2
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip -O gradle.zip
          if [ ! -f gradle.zip ]; then
            echo "Download failed, trying alternate URL..."
            wget -q https://downloads.gradle-dn.com/distributions/gradle-8.0.2-bin.zip -O gradle.zip
          fi
          unzip -q gradle.zip
          echo "Gradle extracted to:"
          ls -la /tmp/gradle-8.0.2/bin/

      - name: Build APK
        working-directory: android-app
        run: |
          /tmp/gradle-8.0.2/bin/gradle clean assembleRelease --no-daemon --stacktrace 2>&1 || true

      - name: Search for APK
        working-directory: android-app
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build outputs ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
            android-app/app/build/outputs/apk/**/*.apk
            android-app/app/build/outputs/apk/release/*.apk