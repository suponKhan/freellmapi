name: android-build
on:
  push:
    branches: [ android-gateway ]
    paths-ignore:
      - 'build-log.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Set up Gradle 8.2.1
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2.1

      - name: Build APK
        working-directory: android-app
        run: |
          echo "=== Building APK ==="
          gradle clean assembleRelease --no-daemon --stacktrace > build-log.txt 2>&1
          echo "BUILD EXIT CODE: $?" >> build-log.txt
          echo "--- log head ---"
          head -50 build-log.txt

      - name: Push build log via API
        if: always()
        run: |
          cd android-app
          B64=$(base64 -w0 build-log.txt)
          python3 -c "
import json, os, urllib.request
b64 = '$B64'
data = json.dumps({'message': 'build log', 'branch': 'android-gateway', 'content': b64}).encode()
req = urllib.request.Request('https://api.github.com/repos/suponKhan/freellmapi/contents/build-log.txt',
    data=data, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'User-Agent': 'actions'})
try:
    resp = urllib.request.urlopen(req)
    print('Pushed log:', resp.status)
except Exception as e:
    print('Push failed:', e)
"

      - name: Search for APK
        if: always()
        working-directory: android-app
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build outputs ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
          if-no-files-found: warn