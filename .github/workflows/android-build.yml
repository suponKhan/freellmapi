name: android-build

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0.2-all.zip -O /tmp/gradle.zip
          mkdir -p $HOME/gradle
          unzip -q /tmp/gradle.zip -d $HOME/gradle
          echo "GRADLE_HOME=$HOME/gradle/gradle-8.0.2" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/gradle/gradle-8.0.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: $HOME/gradle/gradle-8.0.2/bin/gradle wrapper --gradle-version 8.0.2 --distribution-type all

      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleRelease || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: android-app/app/build/outputs/**/*.apk