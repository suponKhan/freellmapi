name: Android Build & Release

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11066339_latest.zip -O cmd-tools.zip
          mkdir -p $ANDROID_HOME
          unzip -q cmd-tools.zip -d $ANDROID_HOME
          yes | $ANDROID_HOME/cmd-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate debug keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v -keystore app/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apks
          path: android-app/app/build/outputs/apk/release/*.apk
