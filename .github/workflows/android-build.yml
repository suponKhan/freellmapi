name: android-build
on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Download Gradle and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME/gradle
          export PATH="$HOME/gradle/gradle-8.0.2/bin:$PATH"
          cd android-app
          gradle wrapper --gradle-version 8.0.2 --distribution-type all
          chmod +x gradlew

      - name: Build APK with wrapper
        working-directory: android-app
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1

      - name: Search for APK
        working-directory: android-app
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build outputs ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: android-app/app/build/outputs/apk/**/*.apk