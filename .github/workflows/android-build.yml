name: android-build
on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Check project structure
        working-directory: android-app
        run: |
          echo "=== Project structure ==="
          find . -name "*.gradle" -o -name "AndroidManifest.xml" | head -20
          echo "=== build.gradle content ==="
          cat build.gradle
          echo "=== app/build.gradle content ==="
          cat app/build.gradle

      - name: Build APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace --info 2>&1 || true

      - name: Search for APK
        working-directory: android-app
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo "=== Build outputs directory ==="
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
            android-app/app/build/outputs/apk/**/*.apk
            android-app/app/build/outputs/apk/release/*.apk