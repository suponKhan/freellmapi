name: Android Build & Release

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tashfeenahmed/freellmapi.git || true
      - name: Sync
        run: |
          git fetch upstream main
          git merge upstream/main --no-edit -X ours || true
          git push origin HEAD:android-gateway

  build:
    runs-on: ubuntu-latest
    needs: sync-upstream
    strategy:
      matrix:
        arch: [ arm64, arm32 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      # Use a more robust Android SDK setup action or manual install
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          # Ensure ndk version exists or remove specific version
          
      - name: Generate debug keystore
        working-directory: android-app
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.storeFile: debug.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.storePassword: android
          ORG_GRADLE_PROJECT_android.injected.signing.keyAlias: androiddebugkey
          ORG_GRADLE_PROJECT_android.injected.signing.keyPassword: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-${{ matrix.arch }}
          path: android-app/app/build/outputs/apk/release/*.apk
