name: android-build

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Build APK
        working-directory: android-app
        run: |
          gradle assembleRelease --no-daemon --stacktrace || true
          echo "=== Build outputs ==="
          find . -name "*.apk" -type f
          ls -la app/build/outputs/ 2>/dev/null || true
          ls -la app/build/outputs/apk/ 2>/dev/null || true
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: |
            android-app/app/build/outputs/**/*.apk
            android-app/app/build/outputs/apk/**/*.apk