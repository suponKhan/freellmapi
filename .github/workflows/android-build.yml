name: android-build

on:
  push:
    branches: [ android-gateway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.0.2 --distribution-type all

      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleRelease || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freellm-gateway-apk
          path: android-app/app/build/outputs/**/*.apk